[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mute-chat"
version = "1.1.0"
description = "Serverless end-to-end encrypted chat and file transfer (Noise protocol, optional Tor)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "cryptography>=42",
    "noiseprotocol>=0.3.1",
    "stem>=1.8",
    "PySocks>=1.7",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Communications :: Chat",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Homepage = "https://github.com/Speederhun/Mute-"

[project.scripts]
mute = "mute:entry"

[tool.setuptools]
py-modules = ["mute"]
