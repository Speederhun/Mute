org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Tor binaries (Briar's Android builds of tor, obfs4/meek and snowflake).
# "+" takes the newest published version. After the first successful build pin the
# versions you got, so builds stay reproducible.
torAndroidVersion=+
obfs4ProxyAndroidVersion=+
snowflakeAndroidVersion=+
