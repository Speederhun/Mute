name: build

# Separate build and separate GitHub release for every platform.
# Push a tag like v1.1.0 (or run this workflow manually with a version) and three releases are created:
#   windows-v1.1.0, linux-v1.1.0, macos-v1.1.0  (each with its own binaries, installer pack and checksums)
on:
  push:
    branches: [main]
    tags: ["v*", "android-v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Publish releases for this version (e.g. v1.1.0). Leave empty to only build."
        required: false
        default: ""

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}   # a macOS test problem must not block the Windows/Linux releases
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies (hash-checked)
        run: pip install --require-hashes -r requirements.lock
      - run: pip install -r tests/requirements.txt
      - run: python tests/test_scrub.py
      - run: python tests/test_loopback.py
      - run: python tests/test_fuzz.py
      - run: python tests/test_themes.py
      - run: python tests/test_moat.py
      - run: python tests/test_voice.py
      - name: Package installs and starts
        run: |
          pip install --no-deps .
          mute --help

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - name: Static analysis
        run: bandit -q -r mute.py -ll
        continue-on-error: true
      - name: Known vulnerabilities in dependencies
        run: pip-audit --require-hashes -r requirements.lock
        continue-on-error: true

  windows:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write       # lets GitHub sign where the build came from
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install pyinstaller
      - name: Build GUI and CLI executables
        shell: bash
        run: |
          OPTS="--onefile --hidden-import stem.control --hidden-import stem.process --hidden-import socks --collect-submodules noise --collect-all tkinterdnd2 --hidden-import sounddevice --hidden-import opuslib"
          python -m PyInstaller $OPTS --windowed --icon assets/mute.ico --name Mute mute.py
          python -m PyInstaller $OPTS --icon assets/mute.ico --name Mute-cli mute.py
      - name: Installer pack (no git needed - installs Python and Tor if missing)
        shell: bash
        run: git archive --format=zip --prefix=Mute/ -o dist/Mute-windows-installer.zip HEAD mute.py requirements.txt requirements.lock pyproject.toml LICENSE README.md assets windows
      - name: Attest build provenance (release runs only)
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')) && !github.event.repository.private   # attestations need a public repo (or a paid plan)
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/Mute.exe
            dist/Mute-cli.exe
            dist/Mute-windows-installer.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mute-windows
          path: |
            dist/Mute.exe
            dist/Mute-cli.exe
            dist/Mute-windows-installer.zip

  linux:
    needs: test
    runs-on: ubuntu-22.04   # older glibc -> runs on more distributions
    permissions:
      contents: read
      id-token: write       # lets GitHub sign where the build came from
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install pyinstaller
      - name: Build binary
        run: |
          python -m PyInstaller --onefile --name Mute \
            --hidden-import stem.control --hidden-import stem.process --hidden-import socks \
            --collect-submodules noise --collect-all tkinterdnd2 --hidden-import sounddevice --hidden-import opuslib mute.py
          chmod +x dist/Mute
          tar -C dist -czf dist/Mute-linux.tar.gz Mute
      - name: Installer pack (installs only missing packages, never upgrades the system)
        run: git archive --format=tar.gz --prefix=Mute/ -o dist/Mute-linux-installer.tar.gz HEAD mute.py requirements.txt requirements.lock pyproject.toml LICENSE README.md assets linux
      - name: Attest build provenance (release runs only)
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')) && !github.event.repository.private   # attestations need a public repo (or a paid plan)
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/Mute-linux.tar.gz
            dist/Mute-linux-installer.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: Mute-linux
          path: |
            dist/Mute-linux.tar.gz
            dist/Mute-linux-installer.tar.gz

  macos:
    needs: test
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write       # lets GitHub sign where the build came from
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.lock
      - run: pip install pyinstaller
      - name: Build app bundle
        run: |
          python -m PyInstaller --windowed --icon assets/mute.icns --name Mute \
            --hidden-import stem.control --hidden-import stem.process --hidden-import socks \
            --collect-submodules noise --collect-all tkinterdnd2 --hidden-import sounddevice --hidden-import opuslib mute.py
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string 'Mute uses the microphone only during a voice call you accept or start.'" dist/Mute.app/Contents/Info.plist
          codesign --force --deep -s - dist/Mute.app
          ditto -c -k --sequesterRsrc --keepParent dist/Mute.app dist/Mute-macos.zip
      - name: Installer pack (Homebrew based)
        run: git archive --format=zip --prefix=Mute/ -o dist/Mute-macos-installer.zip HEAD mute.py requirements.txt requirements.lock pyproject.toml LICENSE README.md assets macos
      - name: Attest build provenance (release runs only)
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')) && !github.event.repository.private   # attestations need a public repo (or a paid plan)
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/Mute-macos.zip
            dist/Mute-macos-installer.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Mute-macos
          path: |
            dist/Mute-macos.zip
            dist/Mute-macos-installer.zip

  android:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write       # lets GitHub sign where the build came from
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5      # Chaquopy needs a Python 3.12 on the build machine
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@v3
        with:
          packages: ''          # the old default 'tools' package no longer exists; Gradle fetches what it needs
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Signing key (only if the repository secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.MUTE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mute.jks"
            echo "MUTE_KEYSTORE=$RUNNER_TEMP/mute.jks" >> "$GITHUB_ENV"
            echo "Using the release signing key from the repository secrets"
          else
            echo "No MUTE_KEYSTORE_B64 secret: the APK is signed with a throw-away debug key (see android/README.md)"
          fi
      - name: Build the APK
        working-directory: android
        env:
          MUTE_KEYSTORE_PASSWORD: ${{ secrets.MUTE_KEYSTORE_PASSWORD }}
          MUTE_KEY_ALIAS: ${{ secrets.MUTE_KEY_ALIAS }}
          MUTE_KEY_PASSWORD: ${{ secrets.MUTE_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          mkdir -p ../dist
          cp app/build/outputs/apk/release/*.apk ../dist/Mute-android.apk
          ls -l ../dist
      - name: Attest build provenance (release runs only)
        if: (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')) && !github.event.repository.private   # attestations need a public repo (or a paid plan)
        continue-on-error: true
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/Mute-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Mute-android
          path: dist/Mute-android.apk

  release-windows:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Mute-windows
          path: artifacts
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS-windows.txt && cat SHA256SUMS-windows.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Mute ${{ inputs.version || github.ref_name }} for Windows
          generate_release_notes: true
          body: |
            **Windows build.** `Mute.exe` (GUI) and `Mute-cli.exe` need no Python.
            `Mute-windows-installer.zip`: unzip and double-click `windows\install.bat` - it installs Python and Tor if missing and adds a desktop shortcut.
            The executables are not code-signed, so Windows SmartScreen may warn. Verify: `gh attestation verify Mute.exe --repo Speederhun/Mute` (proves it was built by this repository's workflow), and compare the SHA-256 in `SHA256SUMS-windows.txt`.
            Not audited, see SECURITY.md.
          files: artifacts/*

  release-linux:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Mute-linux
          path: artifacts
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS-linux.txt && cat SHA256SUMS-linux.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: linux-${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Mute ${{ inputs.version || github.ref_name }} for Linux
          generate_release_notes: true
          body: |
            **Linux build** (built on Ubuntu 22.04, runs on most distributions with a similar or newer glibc).
            `Mute-linux.tar.gz`: single binary (needs Tkinter for the GUI; `tor` for Tor mode).
            `Mute-linux-installer.tar.gz`: extract and run `bash linux/install.sh` - installs only missing packages (Arch, Debian/Ubuntu/Kali, Fedora, openSUSE), never upgrades the system.
            Verify: `gh attestation verify Mute-linux.tar.gz --repo Speederhun/Mute` (proves it was built by this repository's workflow), and compare the SHA-256 in `SHA256SUMS-linux.txt`. Not audited, see SECURITY.md.
          files: artifacts/*

  release-macos:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Mute-macos
          path: artifacts
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS-macos.txt && cat SHA256SUMS-macos.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: macos-${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Mute ${{ inputs.version || github.ref_name }} for macOS
          generate_release_notes: true
          body: |
            **macOS build.** `Mute-macos.zip` contains the unsigned `Mute.app` (first start: right-click > Open, or `xattr -dr com.apple.quarantine Mute.app`).
            `Mute-macos-installer.zip`: unzip and run `bash macos/install.sh` - uses Homebrew for Python and Tor.
            Verify: `gh attestation verify Mute-macos.zip --repo Speederhun/Mute` (proves it was built by this repository's workflow), and compare the SHA-256 in `SHA256SUMS-macos.txt`. Not audited, see SECURITY.md.
          files: artifacts/*

  release-android:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/android-v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Mute-android
          path: artifacts
      - name: Release tag
        id: tag
        run: |
          V="${{ inputs.version || github.ref_name }}"
          V="${V#android-}"
          echo "name=android-$V" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS-android.txt && cat SHA256SUMS-android.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: Mute ${{ steps.tag.outputs.version }} for Android
          generate_release_notes: true
          body: |
            **Android app** (Android 7.0 or newer, 64-bit phones: arm64 or x86_64). Download `Mute-android.apk` on your phone and open it.
            Android asks you to allow installing from this source once (Settings > Apps > Special access > Install unknown apps). Then tap Install.
            DIRECT and TOR modes, the same protocol as the desktop version (they can talk to each other). The app contains its own Tor, nothing else to install.
            Verify: `gh attestation verify Mute-android.apk --repo Speederhun/Mute` (proves it was built by this repository's workflow), and compare the SHA-256 in `SHA256SUMS-android.txt`. Not audited, see SECURITY.md. Details: `android/README.md`.
          files: artifacts/*
