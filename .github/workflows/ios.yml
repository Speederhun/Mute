name: ios-build

# Compiles the iOS app for the simulator (ad-hoc signature, no Apple account) so build errors show up in the log.
on:
  workflow_dispatch:
  push:
    paths: ["ios/**", "mute.py", "android/python/**", ".github/workflows/ios.yml"]

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tools
        run: brew install xcodegen cocoapods
      - name: Cache the Python runtime and wheels
        uses: actions/cache@v4
        with:
          path: |
            ios/Support
            ios/app_packages.iphoneos
            ios/app_packages.iphonesimulator
          key: ios-python-${{ hashFiles('ios/setup.sh') }}
      - name: Set up project (Python runtime, wheels, xcodegen, pods)
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./setup.sh
      - name: Build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -workspace Mute.xcworkspace -scheme Mute -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO build 2>&1 | tee build.log | tail -n 200
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ios/build.log

  ios-ipa:
    # Unsigned device build packed as an .ipa: install it on an iPhone with Sideloadly or AltStore (they sign it with your Apple ID).
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: brew install xcodegen cocoapods
      - name: Cache the Python runtime and wheels
        uses: actions/cache@v4
        with:
          path: |
            ios/Support
            ios/app_packages.iphoneos
            ios/app_packages.iphonesimulator
          key: ios-python-${{ hashFiles('ios/setup.sh') }}
      - name: Set up project
        working-directory: ios
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./setup.sh
      - name: Build for devices
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -workspace Mute.xcworkspace -scheme Mute -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee build.log | tail -n 100
      - name: Pack the .ipa
        working-directory: ios
        run: |
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Mute.app Payload/
          zip -qry Mute-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Mute-ios-unsigned
          path: ios/Mute-ios-unsigned.ipa
